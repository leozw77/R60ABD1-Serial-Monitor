name: Build R60ABD1 Serial Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C3 monitor
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32c3
          command: idf.py set-target esp32c3 && idf.py build
      - name: Show effective console config
        run: grep -E "CONFIG_ESP_CONSOLE_(UART_DEFAULT|SECONDARY_USB_SERIAL_JTAG|USB_SERIAL_JTAG_ENABLED)" sdkconfig || true
      - name: Show app info
        run: |
          ls -lh build/r60abd1_serial_monitor.bin
          sha256sum build/r60abd1_serial_monitor.bin
      - name: Upload app-only firmware
        uses: actions/upload-artifact@v4
        with:
          name: R60ABD1-Serial-Monitor-ESP32C3-app
          path: build/r60abd1_serial_monitor.bin
